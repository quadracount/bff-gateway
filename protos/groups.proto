syntax = "proto3";
package groups;

service GroupsService {
  rpc RegisterUser (RegisterUserRequest) returns (User);
  rpc VerifyCredentials (VerifyCredentialsRequest) returns (User);
  rpc GetUser (GetUserRequest) returns (User);

  rpc ListGroupsForUser (ListGroupsForUserRequest) returns (ListGroupsResponse);
  rpc GetGroup (GetGroupRequest) returns (Group);
  rpc CreateGroup (CreateGroupRequest) returns (Group);
  rpc AddMember (AddMemberRequest) returns (Group);
  rpc RemoveMember (RemoveMemberRequest) returns (Group);

  rpc CreateExpense (CreateExpenseRequest) returns (Expense);
  rpc ListExpenses (ListExpensesRequest) returns (ListExpensesResponse);
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
}

message RegisterUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message VerifyCredentialsRequest {
  string email = 1;
  string password = 2;
}

message GetUserRequest {
  string user_id = 1;
}

message Member {
  string user_id = 1;
  string name = 2;
}

message Group {
  string id = 1;
  string name = 2;
  repeated Member members = 3;
  string created_at = 4;
}

message Share {
  string user_id = 1;
  int64 amount = 2;
}

message Expense {
  string id = 1;
  string group_id = 2;
  string description = 3;
  int64 amount = 4;
  string paid_by = 5;
  repeated Share shares = 6;
  string source = 7;
  string created_at = 8;
}

message ListGroupsForUserRequest {
  string user_id = 1;
}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message GetGroupRequest {
  string group_id = 1;
  string requester_id = 2;
}

message CreateGroupRequest {
  string name = 1;
  string requester_id = 2;
}

message AddMemberRequest {
  string group_id = 1;
  string email = 2;
  string requester_id = 3;
}

message RemoveMemberRequest {
  string group_id = 1;
  string user_id = 2;
  string requester_id = 3;
}

message CreateExpenseRequest {
  string group_id = 1;
  string description = 2;
  int64 amount = 3;
  string paid_by = 4;
  repeated Share shares = 5;
  string source = 6;
  string requester_id = 7;
}

message ListExpensesRequest {
  string group_id = 1;
  string requester_id = 2;
}

message ListExpensesResponse {
  repeated Expense expenses = 1;
}
